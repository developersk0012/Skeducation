<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK Education</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0c0c2e 0%, #1a1a3e 50%, #2d1b69 100%); min-height: 100vh; color: white; }

        /* ===== LOGIN ===== */
        #loginScreen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .login-container { max-width: 420px; width: 100%; padding: 45px 35px; background: rgba(255,255,255,0.06); backdrop-filter: blur(20px); border-radius: 24px; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
        .login-logo { font-size: 60px; text-align: center; margin-bottom: 10px; }
        .login-title { font-size: 28px; font-weight: 700; text-align: center; background: linear-gradient(90deg, #4cc9f0, #f72585); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; }
        .login-subtitle { color: #a5b4fc; text-align: center; font-size: 15px; margin-bottom: 25px; }
        .login-input-group { margin-bottom: 18px; }
        .login-input-group label { display: block; color: #a5b4fc; font-size: 14px; font-weight: 600; margin-bottom: 5px; }
        .login-input-group input { width: 100%; padding: 14px 18px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white; font-size: 16px; }
        .login-input-group input:focus { outline: none; border-color: #4361ee; background: rgba(255,255,255,0.08); }
        .login-input-group input::placeholder { color: #4a5a7a; }
        .login-btn { width: 100%; padding: 16px; background: linear-gradient(90deg, #4361ee, #f72585); border: none; border-radius: 12px; color: white; font-size: 18px; font-weight: 700; cursor: pointer; transition: all .2s; }
        .login-btn:hover { transform: scale(1.02); }
        .login-error { color: #f72585; margin-top: 12px; text-align: center; font-size: 14px; display: none; }

        /* ===== MAIN APP ===== */
        #mainApp { display: none; }
        .main-container { max-width: 1100px; margin: 0 auto; padding: 20px 25px 40px; }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 25px; background: rgba(255,255,255,0.04); backdrop-filter: blur(12px); border-radius: 16px; border: 1px solid rgba(255,255,255,0.06); margin-bottom: 30px; flex-wrap: wrap; gap: 12px; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .logo-icon { width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(135deg, #4361ee, #f72585); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; color: white; }
        .header-left h2 { font-size: 20px; color: white; margin: 0; }
        .header-left small { color: #a5b4fc; font-size: 13px; display: block; }
        .header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .user-badge { background: rgba(67,97,238,0.2); padding: 6px 18px; border-radius: 50px; font-size: 14px; color: #a5b4fc; border: 1px solid rgba(67,97,238,0.15); }
        .icon-btn { background: rgba(255,255,255,0.06); padding: 8px 14px; border-radius: 50px; text-decoration: none; color: #a5b4fc; font-size: 18px; transition: all .2s; }
        .icon-btn:hover { background: rgba(255,255,255,0.12); color: white; }
        .icon-btn.wa-icon-btn { color: #25d366; }
        .logout-link { background: none; border: none; color: #f72585; font-size: 13px; cursor: pointer; padding: 6px 12px; border-radius: 50px; transition: all .2s; }
        .logout-link:hover { background: rgba(247,37,133,0.15); }

        .announcement-box { background: rgba(67,97,238,0.12); border-left: 4px solid #4361ee; padding: 16px 20px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .announcement-box .msg { flex: 1; color: white; }
        .announcement-box .msg strong { color: #4cc9f0; display: block; font-size: 14px; }
        .announcement-box .msg small { color: #6a7a9e; font-size: 12px; display: block; margin-top: 4px; }
        .ann-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .seen-btn { background: rgba(76,201,240,0.15); color: #4cc9f0; border: 1px solid rgba(76,201,240,0.15); padding: 6px 16px; border-radius: 50px; cursor: pointer; font-size: 13px; transition: all .2s; }
        .seen-btn:hover { background: rgba(76,201,240,0.3); }
        .reply-btn { background: rgba(67,97,238,0.15); color: #4361ee; border: 1px solid rgba(67,97,238,0.15); padding: 6px 16px; border-radius: 50px; text-decoration: none; font-size: 13px; transition: all .2s; }
        .reply-btn:hover { background: rgba(67,97,238,0.3); }

        .section-title { font-size: 26px; font-weight: 700; margin: 30px 0 20px; background: linear-gradient(90deg, #4cc9f0, #f72585); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .batch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; margin-top: 15px; }
        .batch-card { background: rgba(255,255,255,0.04); backdrop-filter: blur(8px); border-radius: 18px; overflow: hidden; border: 1px solid rgba(255,255,255,0.06); transition: all 0.4s; text-decoration: none; color: white; opacity: 0; animation: cardIn .4s ease forwards; }
        .batch-card:hover { transform: translateY(-8px); box-shadow: 0 20px 50px rgba(0,0,0,0.4); border-color: rgba(67,97,238,0.3); }
        .batch-card img { width: 100%; height: 200px; object-fit: cover; background: rgba(255,255,255,0.05); }
        .batch-card .batch-info { padding: 18px 20px 22px; }
        .batch-card .batch-info h3 { font-size: 18px; margin-bottom: 4px; }
        .batch-card .batch-info p { color: #a5b4fc; font-size: 14px; margin-bottom: 8px; }
        .batch-badge { display: inline-block; background: rgba(67,97,238,0.2); padding: 3px 14px; border-radius: 50px; font-size: 12px; color: #a5b4fc; }

        @keyframes cardIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        .loading { text-align: center; padding: 50px 20px; color: #a5b4fc; }
        .spinner { width: 40px; height: 40px; margin: 0 auto 14px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #4cc9f0; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .main-container { padding: 15px; }
            .login-container { padding: 30px 20px; }
            .header { flex-direction: column; align-items: stretch; gap: 10px; }
            .header-right { justify-content: center; }
            .batch-grid { grid-template-columns: 1fr; }
            .announcement-box { flex-direction: column; align-items: stretch; }
            .ann-actions { justify-content: flex-end; }
        }
    </style>
</head>
<body>

    <!-- ===== LOGIN ===== -->
    <div id="loginScreen">
        <div class="login-container">
            <div class="login-logo">📚</div>
            <h2 class="login-title">Welcome to SK Education</h2>
            <p class="login-subtitle">Enter your name to access study materials</p>
            <form id="loginForm">
                <div class="login-input-group">
                    <label>👤 Your Name</label>
                    <input type="text" id="loginName" placeholder="Enter your full name" required>
                </div>
                <button type="submit" class="login-btn">🚀 Continue</button>
                <div id="loginError" class="login-error"></div>
            </form>
        </div>
    </div>

    <!-- ===== MAIN APP ===== -->
    <div id="mainApp">
        <div class="main-container">
            
            <!-- HEADER -->
            <div class="header">
                <div class="header-left">
                    <div class="logo-icon">SK</div>
                    <div>
                        <h2>SK Education</h2>
                        <small>Study Materials</small>
                    </div>
                </div>
                <div class="header-right">
                    <span class="user-badge" id="userDisplay">👋 User</span>
                    <a id="waLinkBtn" href="#" target="_blank" class="icon-btn wa-icon-btn" title="Join WhatsApp Channel">💬</a>
                    <a href="announcements.html" class="icon-btn">📢</a>
                    <button onclick="logout()" class="logout-link">Logout</button>
                </div>
            </div>

            <!-- ANNOUNCEMENTS -->
            <div id="announcementBox"></div>

            <!-- BATCHES -->
            <h2 class="section-title">📚 Select Your Batch</h2>
            <div class="batch-grid" id="batchGrid">
                <div class="loading"><div class="spinner"></div>⏳ Loading batches...</div>
            </div>
            
        </div>
    </div>

    <script>
    // ========================================
    // CHECK LOGIN
    // ========================================
    const userName = getUserName();
    
    if (userName) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        document.getElementById('userDisplay').textContent = '👋 ' + userName;
        document.getElementById('waLinkBtn').href = WHATSAPP_GROUP_LINK;
        loadAnnouncements();
        loadBatchGrid();
        checkMaintenance();

        // WhatsApp popup — user panel khulte hi (thodi delay ke saath, taaki
        // page pehle render ho jaaye aur popup achanak na tapke)
        setTimeout(showWhatsAppPopup, 900);
    } else {
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('mainApp').style.display = 'none';
    }

    // ========================================
    // LOGIN FORM
    // ========================================
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const name = document.getElementById('loginName').value.trim();
        const errorDiv = document.getElementById('loginError');
        
        errorDiv.style.display = 'none';
        
        if (!name) {
            errorDiv.style.display = 'block';
            errorDiv.textContent = '⚠️ Please enter your name!';
            return;
        }
        
        setUserName(name);
        location.reload();
    });

    // ========================================
    // LOAD BATCH GRID (ab Firebase se dynamic — admin panel se
    // naya batch add karte hi yahan turant dikhega)
    // ========================================
    function loadBatchGrid() {
        const grid = document.getElementById('batchGrid');
        const timer = withLoadingTimeout(grid);

        loadBatches().then(function(batches) {
            clearTimeout(timer);
            const keys = Object.keys(batches).sort(function(a, b) { return Number(a) - Number(b); });

            if (!keys.length) {
                grid.innerHTML = '<div style="color:#a5b4fc;text-align:center;padding:40px;grid-column:1/-1;">📭 Abhi koi batch available nahi hai</div>';
                return;
            }

            let html = '';
            keys.forEach(function(id, i) {
                const b = batches[id];
                html += `
                    <a href="batch.html?batch=${id}" class="batch-card" style="animation-delay:${i * 0.06}s">
                        <img src="${b.image}" alt="${b.name}" onerror="this.src='https://via.placeholder.com/400x200/4361ee/white?text=SK+Education'">
                        <div class="batch-info">
                            <h3>${b.icon} ${b.name}</h3>
                            <p>${b.description}</p>
                            <span class="batch-badge">📚 All Subjects</span>
                        </div>
                    </a>
                `;
            });
            grid.innerHTML = html;
        }).catch(function(err) {
            clearTimeout(timer);
            showDbError(grid, err);
        });
    }

    // ========================================
    // LOAD ANNOUNCEMENTS
    // ========================================
    function loadAnnouncements() {
        const box = document.getElementById('announcementBox');
        db.ref('announcements').orderByChild('timestamp').limitToLast(3).on('value', function(snap) {
            const data = snap.val();
            box.innerHTML = '';
            
            if (data) {
                const keys = Object.keys(data).reverse();
                keys.forEach(function(key) {
                    const ann = data[key];
                    box.innerHTML += `
                        <div class="announcement-box" id="ann-${key}">
                            <div class="msg">
                                <strong>📢 Announcement</strong>
                                <div>${ann.message}</div>
                                <small>${new Date(ann.timestamp).toLocaleString()}</small>
                            </div>
                            <div class="ann-actions">
                                <button class="seen-btn" onclick="markAsSeen('${key}')">✓ Seen</button>
                                <a href="mailto:${ADMIN_EMAIL}?subject=Reply to Announcement" class="reply-btn" onclick="event.stopPropagation();">✉ Reply</a>
                            </div>
                        </div>
                    `;
                });
            }
        }, function(err) {
            showDbError(box, err);
        });
    }

    // ========================================
    // MARK AS SEEN
    // ========================================
    function markAsSeen(id) {
        const name = getUserName() || 'Unknown';
        
        db.ref('seen_announcements').push({
            announcement_id: id,
            user_name: name,
            timestamp: new Date().toISOString()
        }).then(function() {
            const el = document.getElementById('ann-' + id);
            if (el) el.style.opacity = '0.5';
            showToast('✅ Marked as seen!');
        }).catch(function(err) {
            console.error('Mark as seen failed:', err);
            showToast('❌ Kuch gadbad ho gayi, phir try karein.', 'error');
        });
    }

    // ========================================
    // CHECK MAINTENANCE
    // ========================================
    function checkMaintenance() {
        db.ref('settings/maintenance').on('value', function(snap) {
            if (snap.val() === 'on') {
                document.getElementById('mainApp').style.display = 'none';
                document.body.innerHTML = `
                    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0c0c2e,#1a1a3e);color:white;text-align:center;font-family:Arial;padding:20px;">
                        <div style="padding:50px;border-radius:20px;border:1px solid rgba(255,255,255,0.1);max-width:500px;">
                            <div style="font-size:80px;margin-bottom:20px;">🔧</div>
                            <h1 style="font-size:36px;">Under Maintenance</h1>
                            <p style="color:#a5b4fc;">We're updating our content. Please check back soon!</p>
                        </div>
                    </div>
                `;
            }
        }, function(err) {
            console.error('Maintenance check failed:', err);
        });
    }

    // ========================================
    // LOGOUT
    // ========================================
    function logout() {
        clearUserName();
        location.reload();
    }

    window.markAsSeen = markAsSeen;
    window.logout = logout;
    </script>
</body>
</html>
