<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batch - SK Education</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0c0c2e 0%, #1a1a3e 50%, #2d1b69 100%);
            min-height: 100vh;
            color: white;
        }

        .main-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px 25px 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 25px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4361ee, #f72585);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 16px;
            color: white;
            box-shadow: 0 4px 15px rgba(67, 97, 238, 0.3);
        }

        .header-left h2 {
            font-size: 20px;
            color: white;
            margin: 0;
        }

        .header-left small {
            color: #a5b4fc;
            font-size: 13px;
            display: block;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .user-badge {
            background: rgba(67, 97, 238, 0.2);
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 14px;
            color: #a5b4fc;
            border: 1px solid rgba(67, 97, 238, 0.15);
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.06);
            padding: 8px 14px;
            border-radius: 50px;
            text-decoration: none;
            color: #a5b4fc;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: white;
        }

        .logout-link {
            background: none;
            border: none;
            color: #f72585;
            font-size: 13px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 50px;
            transition: 0.3s;
        }

        .logout-link:hover {
            background: rgba(247, 37, 133, 0.15);
        }

        .batch-banner {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .batch-banner img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .batch-banner-info {
            padding: 25px 30px;
        }

        .batch-banner-info h1 {
            font-size: 28px;
            margin-bottom: 4px;
        }

        .batch-banner-info p {
            color: #a5b4fc;
            font-size: 16px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            margin: 25px 0 18px;
            background: linear-gradient(90deg, #4cc9f0, #f72585);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 18px;
            margin-top: 10px;
        }

        .category-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(8px);
            border-radius: 14px;
            padding: 25px 18px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
            text-decoration: none;
            color: white;
        }

        .category-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(67, 97, 238, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .category-card .cat-icon {
            font-size: 36px;
            display: block;
            margin-bottom: 8px;
        }

        .category-card h3 {
            font-size: 16px;
            margin-bottom: 4px;
        }

        .category-card small {
            color: #6a7a9e;
            font-size: 13px;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #4cc9f0;
            text-decoration: none;
            font-size: 15px;
            transition: 0.3s;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #a5b4fc;
        }

        @media (max-width: 768px) {
            .main-container {
                padding: 15px;
            }

            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }

            .header-right {
                justify-content: center;
            }

            .batch-banner img {
                height: 160px;
            }

            .batch-banner-info {
                padding: 18px 20px;
            }

            .batch-banner-info h1 {
                font-size: 22px;
            }

            .category-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .category-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        
        <!-- HEADER -->
        <div class="header">
            <div class="header-left">
                <div class="logo-icon">SK</div>
                <div>
                    <h2 id="batchTitle">Batch</h2>
                    <small id="batchSubtitle">Loading...</small>
                </div>
            </div>
            <div class="header-right">
                <span class="user-badge" id="userDisplay">👋 User</span>
                <a href="index.html" class="icon-btn">🏠</a>
                <button onclick="logout()" class="logout-link">Logout</button>
            </div>
        </div>

        <!-- BATCH BANNER -->
        <div class="batch-banner">
            <img id="batchImage" src="" alt="Batch" onerror="this.src='https://via.placeholder.com/800x250/4361ee/white?text=SK+Education'">
            <div class="batch-banner-info">
                <h1 id="batchName">Batch</h1>
                <p id="batchDesc">Description</p>
            </div>
        </div>

        <!-- CATEGORIES -->
        <h2 class="section-title">📖 Subjects</h2>
        <div class="category-grid" id="categoryGrid">
            <div class="loading">Loading categories...</div>
        </div>

        <a href="index.html" class="back-link">← Back to Batches</a>
    </div>

    <script>
    // ========================================
    // CHECK USER LOGIN
    // ========================================
    const user = getCurrentUser();
    
    if (!user) {
        window.location.href = 'index.html';
        return;
    }

    document.getElementById('userDisplay').textContent = '👋 ' + user.name;

    // ========================================
    // GET BATCH FROM URL
    // ========================================
    const urlParams = new URLSearchParams(window.location.search);
    const batchId = urlParams.get('batch') || '1';

    console.log('📌 Batch ID from URL:', batchId);
    console.log('📦 Available Batches:', BATCHES);

    // Batch details - using BATCHES from config.js
    const batch = BATCHES[batchId];

    if (!batch) {
        console.error('❌ Batch not found for ID:', batchId);
        document.getElementById('batchTitle').textContent = 'Batch Not Found';
        document.getElementById('batchSubtitle').textContent = 'Please go back';
        document.getElementById('batchName').textContent = 'Error';
        document.getElementById('batchDesc').textContent = 'Batch not found';
    } else {
        console.log('✅ Batch found:', batch);
        document.getElementById('batchTitle').textContent = batch.icon + ' ' + batch.name;
        document.getElementById('batchSubtitle').textContent = 'Select a subject';
        document.getElementById('batchImage').src = batch.image;
        document.getElementById('batchName').textContent = batch.icon + ' ' + batch.name;
        document.getElementById('batchDesc').textContent = batch.description;
    }

    // ========================================
    // LOAD CATEGORIES WITH PDF COUNTS
    // ========================================
    function loadCategories() {
        const grid = document.getElementById('categoryGrid');
        grid.innerHTML = '<div class="loading">⏳ Loading categories...</div>';

        console.log('📂 Loading categories for batch:', batchId);

        // Get all PDFs for this batch
        db.ref('pdfs').orderByChild('batch_id').equalTo(parseInt(batchId)).once('value')
        .then(function(snap) {
            const data = snap.val();
            const categoryCount = {};
            
            console.log('📄 PDF Data:', data);
            
            if (data) {
                Object.values(data).forEach(function(pdf) {
                    const cat = pdf.category_id;
                    if (cat) {
                        categoryCount[cat] = (categoryCount[cat] || 0) + 1;
                    }
                });
            }

            console.log('📊 Category Count:', categoryCount);

            let html = '';
            let hasCategories = false;

            for (let [key, name] of Object.entries(CATEGORIES)) {
                const count = categoryCount[key] || 0;
                const icon = CATEGORY_ICONS[key] || '📚';
                
                html += `
                    <a href="subcategory.html?batch=${batchId}&cat=${key}" class="category-card">
                        <span class="cat-icon">${icon}</span>
                        <h3>${name}</h3>
                        <small>${count} materials</small>
                    </a>
                `;
                hasCategories = true;
            }

            grid.innerHTML = html;
            
            if (!hasCategories) {
                grid.innerHTML = '<div style="color:#a5b4fc;text-align:center;padding:40px;">📭 No categories available</div>';
            }
        })
        .catch(function(err) {
            console.error('❌ Error loading categories:', err);
            grid.innerHTML = '<div style="color:#f72585;text-align:center;padding:40px;">❌ Error loading categories. Please try again.</div>';
        });
    }

    // Load categories after a small delay to ensure Firebase is ready
    setTimeout(loadCategories, 500);

    // ========================================
    // CHECK MAINTENANCE
    // ========================================
    db.ref('settings/maintenance').on('value', function(snap) {
        if (snap.val() === 'on') {
            document.querySelector('.main-container').innerHTML = `
                <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0c0c2e,#1a1a3e);color:white;text-align:center;font-family:Arial;padding:20px;">
                    <div style="padding:50px;border-radius:20px;border:1px solid rgba(255,255,255,0.1);max-width:500px;">
                        <div style="font-size:80px;margin-bottom:20px;">🔧</div>
                        <h1 style="font-size:36px;">Under Maintenance</h1>
                        <p style="color:#a5b4fc;">We're updating our content. Please check back soon!</p>
                    </div>
                </div>
            `;
        }
    });

    // ========================================
    // LOGOUT
    // ========================================
    function logout() {
        localStorage.removeItem('sk_user_data');
        window.location.href = 'index.html';
    }

    // ========================================
    // EXPOSE FUNCTIONS
    // ========================================
    window.logout = logout;
    </script>
</body>
</html>
