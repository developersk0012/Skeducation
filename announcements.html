<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements - SK Education</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0c0c2e 0%, #1a1a3e 50%, #2d1b69 100%); min-height: 100vh; color: white; }

        .main-container { max-width: 800px; margin: 0 auto; padding: 20px 25px 40px; }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 25px; background: rgba(255,255,255,0.04); backdrop-filter: blur(12px); border-radius: 16px; border: 1px solid rgba(255,255,255,0.06); margin-bottom: 30px; flex-wrap: wrap; gap: 12px; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .logo-icon { width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(135deg, #4361ee, #f72585); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; color: white; }
        .header-left h2 { font-size: 20px; color: white; margin: 0; }
        .header-left small { color: #a5b4fc; font-size: 13px; display: block; }
        .header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .user-badge { background: rgba(67,97,238,0.2); padding: 6px 18px; border-radius: 50px; font-size: 14px; color: #a5b4fc; border: 1px solid rgba(67,97,238,0.15); }
        .icon-btn { background: rgba(255,255,255,0.06); padding: 8px 14px; border-radius: 50px; text-decoration: none; color: #a5b4fc; font-size: 18px; transition: all .2s; }
        .icon-btn:hover { background: rgba(255,255,255,0.12); color: white; }
        .logout-link { background: none; border: none; color: #f72585; font-size: 13px; cursor: pointer; padding: 6px 12px; border-radius: 50px; transition: all .2s; }
        .logout-link:hover { background: rgba(247,37,133,0.15); }

        .announcement-card { background: rgba(255,255,255,0.04); backdrop-filter: blur(8px); border-radius: 16px; padding: 22px 25px; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.06); opacity: 0; animation: cardIn 0.4s ease forwards; }
        .announcement-card:hover { background: rgba(255,255,255,0.06); }
        .ann-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .ann-badge { font-size: 14px; background: rgba(67,97,238,0.15); padding: 4px 14px; border-radius: 50px; color: #4cc9f0; }
        .ann-date { color: #6a7a9e; font-size: 13px; }
        .ann-card-body { font-size: 17px; line-height: 1.7; color: white; margin-bottom: 16px; padding: 10px 0; }
        .ann-card-footer { display: flex; gap: 10px; flex-wrap: wrap; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 14px; }
        .seen-btn { background: rgba(76,201,240,0.15); color: #4cc9f0; border: 1px solid rgba(76,201,240,0.15); padding: 6px 18px; border-radius: 50px; cursor: pointer; font-size: 13px; transition: all .2s; }
        .seen-btn:hover { background: rgba(76,201,240,0.3); }
        .reply-btn { background: rgba(67,97,238,0.15); color: #4361ee; border: 1px solid rgba(67,97,238,0.15); padding: 6px 18px; border-radius: 50px; text-decoration: none; font-size: 13px; transition: all .2s; }
        .reply-btn:hover { background: rgba(67,97,238,0.3); }

        @keyframes cardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .reply-section { margin-top: 35px; padding: 30px; background: rgba(255,255,255,0.04); border-radius: 16px; border: 1px solid rgba(255,255,255,0.06); text-align: center; }
        .reply-section h3 { color: white; font-size: 22px; margin-bottom: 5px; }
        .reply-section p { color: #a5b4fc; font-size: 14px; margin-bottom: 15px; }
        .reply-btn-large { display: inline-block; padding: 14px 40px; background: linear-gradient(90deg, #f72585, #4361ee); border-radius: 12px; color: white; text-decoration: none; font-weight: 600; font-size: 16px; transition: transform .2s; }
        .reply-btn-large:hover { transform: scale(1.03); }

        .empty-state { text-align: center; padding: 50px 20px; color: #6a7a9e; font-size: 16px; }
        .empty-state .icon { font-size: 48px; display: block; margin-bottom: 12px; }
        .loading { text-align: center; padding: 50px 20px; color: #a5b4fc; }
        .spinner { width: 40px; height: 40px; margin: 0 auto 14px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #4cc9f0; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .main-container { padding: 15px; }
            .header { flex-direction: column; align-items: stretch; gap: 10px; }
            .header-right { justify-content: center; }
            .announcement-card { padding: 18px; }
            .ann-card-body { font-size: 15px; }
            .reply-section { padding: 20px; }
            .reply-btn-large { padding: 12px 25px; font-size: 14px; }
        }
        @media (max-width: 480px) {
            .ann-card-header { flex-direction: column; align-items: flex-start; }
            .ann-card-footer { flex-direction: column; }
            .ann-card-footer button, .ann-card-footer a { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="main-container">
        
        <!-- HEADER -->
        <div class="header">
            <div class="header-left">
                <div class="logo-icon">SK</div>
                <div>
                    <h2>📢 Announcements</h2>
                    <small>All announcements from admin</small>
                </div>
            </div>
            <div class="header-right">
                <span class="user-badge" id="userDisplay">👋 User</span>
                <a href="index.html" class="icon-btn">🏠</a>
                <button onclick="logout()" class="logout-link">Logout</button>
            </div>
        </div>

        <!-- ANNOUNCEMENTS LIST -->
        <div id="announcementsList">
            <div class="loading"><div class="spinner"></div>⏳ Loading announcements...</div>
        </div>

        <!-- REPLY SECTION -->
        <div class="reply-section">
            <h3>💬 Reply to Admin</h3>
            <p>Click the button below to send an email to admin</p>
            <a href="mailto:satendrakkushwaha12@gmail.com" class="reply-btn-large" onclick="event.stopPropagation();">
                ✉ Send Email to Admin
            </a>
        </div>
    </div>

    <script>
    // ========================================
    // CHECK LOGIN
    // ========================================
    const userName = getUserName();
    
    if (!userName) {
        window.location.href = 'index.html';
    } else {

    document.getElementById('userDisplay').textContent = '👋 ' + userName;

    // ========================================
    // LOAD ANNOUNCEMENTS
    // Fixed: error callback add kiya (2nd/3rd arg of .on) taaki
    // Firebase permission/connection error hone par "Loading..."
    // hamesha ke liye atka na rahe, balki asli error dikhe.
    // ========================================
    const annContainer = document.getElementById('announcementsList');
    const annTimer = withLoadingTimeout(annContainer);

    db.ref('announcements').orderByChild('timestamp').on('value', function(snap) {
        clearTimeout(annTimer);
        const data = snap.val();
        const container = document.getElementById('announcementsList');
        
        if (data) {
            const keys = Object.keys(data).reverse();
            let html = '';
            
            keys.forEach(function(key, i) {
                const ann = data[key];
                html += `
                    <div class="announcement-card" id="ann-${key}" style="animation-delay:${i * 0.05}s">
                        <div class="ann-card-header">
                            <span class="ann-badge">📢 Announcement</span>
                            <span class="ann-date">${new Date(ann.timestamp).toLocaleString()}</span>
                        </div>
                        <div class="ann-card-body">
                            ${ann.message}
                        </div>
                        <div class="ann-card-footer">
                            <button class="seen-btn" onclick="markAsSeen('${key}')">✓ Mark as Seen</button>
                            <a href="mailto:${ADMIN_EMAIL}?subject=Reply to Announcement" class="reply-btn" onclick="event.stopPropagation();">✉ Reply</a>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        } else {
            container.innerHTML = `
                <div class="empty-state">
                    <span class="icon">📭</span>
                    No announcements yet
                </div>
            `;
        }
    }, function(err) {
        clearTimeout(annTimer);
        showDbError(document.getElementById('announcementsList'), err);
    });

    // ========================================
    // MARK AS SEEN
    // ========================================
    function markAsSeen(id) {
        const name = getUserName() || 'Unknown';
        
        db.ref('seen_announcements').push({
            announcement_id: id,
            user_name: name,
            timestamp: new Date().toISOString()
        }).then(function() {
            const el = document.getElementById('ann-' + id);
            if (el) el.style.opacity = '0.5';
        }).catch(function(err) {
            console.error('Mark as seen failed:', err);
            alert('❌ Kuch gadbad ho gayi, phir try karein.');
        });
    }

    // ========================================
    // CHECK MAINTENANCE
    // ========================================
    db.ref('settings/maintenance').on('value', function(snap) {
        if (snap.val() === 'on') {
            document.body.innerHTML = `
                <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0c0c2e,#1a1a3e);color:white;text-align:center;font-family:Arial;padding:20px;">
                    <div style="padding:50px;border-radius:20px;border:1px solid rgba(255,255,255,0.1);max-width:500px;">
                        <div style="font-size:80px;margin-bottom:20px;">🔧</div>
                        <h1 style="font-size:36px;">Under Maintenance</h1>
                        <p style="color:#a5b4fc;">We're updating our content. Please check back soon!</p>
                    </div>
                </div>
            `;
        }
    }, function(err) {
        console.error('Maintenance check failed:', err);
    });

    // ========================================
    // LOGOUT
    // ========================================
    function logout() {
        clearUserName();
        window.location.href = 'index.html';
    }

    window.markAsSeen = markAsSeen;
    window.logout = logout;

    } // end else (logged in)
    </script>
</body>
</html>
