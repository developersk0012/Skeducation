<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Materials - SK Education</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="config.js"></script>
</head>
<body>
    <div id="app">
        <div class="main-container">
            <!-- Header -->
            <div class="header">
                <div class="header-left">
                    <div class="logo-icon">SK</div>
                    <div>
                        <h2 id="categoryTitle">Category</h2>
                        <small id="batchNameDisplay">Loading...</small>
                    </div>
                </div>
                <div class="header-right">
                    <span class="user-badge" id="userDisplay">👋 User</span>
                    <a href="batch.html?batch=" id="backToBatch" class="icon-btn" title="Back">←</a>
                    <button onclick="logout()" class="logout-link">Logout</button>
                </div>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab active" onclick="showTab('pdf', this)">📄 PDFs</button>
                <button class="tab" onclick="showTab('video', this)">🎥 Videos</button>
            </div>

            <!-- Content -->
            <div id="pdfContent" class="tab-content"></div>
            <div id="videoContent" class="tab-content" style="display:none;"></div>
        </div>
    </div>

    <script>
    // Check login
    const userName = sessionStorage.getItem('user_name');
    if (!userName) {
        window.location.href = 'index.html';
    }
    document.getElementById('userDisplay').textContent = '👋 ' + userName;

    // Get params
    const batchId = getUrlParam('batch') || 1;
    const catKey = getUrlParam('cat') || 'science';

    // Update header
    document.getElementById('categoryTitle').textContent = CATEGORIES[catKey] || 'Category';
    document.getElementById('batchNameDisplay').textContent = BATCHES[batchId]?.name || 'Batch';
    document.getElementById('backToBatch').href = `batch.html?batch=${batchId}`;

    // Load materials
    function loadMaterials() {
        const pdfContainer = document.getElementById('pdfContent');
        const videoContainer = document.getElementById('videoContent');
        
        pdfContainer.innerHTML = '<div class="loading">Loading PDFs...</div>';
        videoContainer.innerHTML = '<div class="loading">Loading Videos...</div>';

        db.ref('pdfs').orderByChild('batch_id').equalTo(parseInt(batchId)).on('value', function(snap) {
            const data = snap.val();
            let pdfHtml = '';
            let videoHtml = '';
            
            if (data) {
                Object.values(data).forEach(function(pdf) {
                    if (pdf.category_id === catKey) {
                        const itemHtml = `
                            <div class="material-item">
                                <div class="material-icon">${pdf.type === 'pdf' ? '📄' : '🎥'}</div>
                                <div class="material-info">
                                    <h4>${pdf.title || 'Untitled'}</h4>
                                    <p>${pdf.description || ''}</p>
                                    ${pdf.thumbnail ? `<img src="${pdf.thumbnail}" class="material-thumb" alt="Thumbnail">` : ''}
                                    <a href="${pdf.file_path}" target="_blank" class="material-btn ${pdf.type === 'pdf' ? 'pdf-btn' : 'video-btn'}">
                                        ${pdf.type === 'pdf' ? '📥 Download PDF' : '▶️ Watch Video'}
                                    </a>
                                </div>
                            </div>
                        `;
                        
                        if (pdf.type === 'pdf') {
                            pdfHtml += itemHtml;
                        } else {
                            videoHtml += itemHtml;
                        }
                    }
                });
            }

            pdfContainer.innerHTML = pdfHtml || '<div class="empty-state">📭 No PDFs available</div>';
            videoContainer.innerHTML = videoHtml || '<div class="empty-state">🎬 No Videos available</div>';
        });
    }

    // Tab switching
    function showTab(type, el) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        
        document.getElementById('pdfContent').style.display = type === 'pdf' ? 'block' : 'none';
        document.getElementById('videoContent').style.display = type === 'video' ? 'block' : 'none';
    }

    loadMaterials();

    // Check maintenance
    db.ref('settings/maintenance').on('value', function(snap) {
        if (snap.val() === 'on') {
            document.getElementById('app').innerHTML = `
                <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0c0c2e,#1a1a3e);color:white;text-align:center;font-family:Arial;padding:20px;">
                    <div style="padding:50px;border-radius:20px;border:1px solid rgba(255,255,255,0.1);max-width:500px;">
                        <div style="font-size:80px;margin-bottom:20px;">🔧</div>
                        <h1 style="font-size:36px;">Under Maintenance</h1>
                        <p style="color:#a5b4fc;">We're updating our content. Please check back soon!</p>
                    </div>
                </div>
            `;
        }
    });

    function logout() {
        sessionStorage.removeItem('user_name');
        window.location.href = 'index.html';
    }
    </script>
</body>
</html>
